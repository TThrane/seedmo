services:
  seedmo:
    image: ghcr.io/tthrane/seedmo:latest
    container_name: seedmo
    restart: unless-stopped
    environment:
      SEEDMO_PASSWORD: "skift-mig"
      SEEDMO_PEER_PORT: "51515"
      TZ: Europe/Copenhagen
    ports:
      - "8095:8080"
      - "51515:51515/tcp"
      - "51515:51515/udp"
    volumes:
      - /share/Container/seedmo/config:/config
      - /share/Download/seedmo:/downloads
