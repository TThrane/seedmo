services:
  seedmo:
    image: ghcr.io/tthrane/seedmo:latest
    container_name: seedmo
    restart: unless-stopped
    environment:
      SEEDMO_PASSWORD: "skift-mig"
      SEEDMO_PEER_PORT: "51515"
      FORWARDED_ALLOW_IPS: "*"
      TZ: Europe/Copenhagen
    ports:
      - "8095:8080"
      - "51515:51515/tcp"
      - "51515:51515/udp"
    volumes:
      - /share/Container/seedmo/config:/config
      - /share/Downloads/seedmo:/downloads

  # https://seedmo.thrane.dev – Caddy henter selv et Let's Encrypt-certifikat.
  # Routeren skal sende port 443 (og 80) videre til NAS'ens port 9443 (og 9080).
  caddy:
    image: caddy:2
    container_name: seedmo-caddy
    restart: unless-stopped
    command: caddy reverse-proxy --from seedmo.thrane.dev --to seedmo:8080
    ports:
      - "9443:443"
      - "9080:80"
    volumes:
      - /share/Container/seedmo/caddy:/data
    depends_on:
      - seedmo
