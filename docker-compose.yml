services:
  seedmo:
    build: .
    image: seedmo:latest
    container_name: seedmo
    restart: unless-stopped
    environment:
      SEEDMO_PASSWORD: "skift-mig"      # adgangskode til web-siden
      SEEDMO_PEER_PORT: "51515"
      TZ: Europe/Copenhagen
    ports:
      - "8095:8080"                     # web-siden: http://nas-ts864.local:8095
      - "51515:51515/tcp"                 # torrent-trafik
      - "51515:51515/udp"
    volumes:
      - /share/Container/seedmo/config:/config
      - /share/Download/seedmo:/downloads
