services:
  seedmo:
    build: .
    image: seedmo:latest
    container_name: seedmo
    restart: unless-stopped
    environment:
      SEEDMO_PASSWORD: "skift-mig"      # adgangskode til web-siden
      SEEDMO_PEER_PORT: "6881"
      TZ: Europe/Copenhagen
    ports:
      - "8085:8080"                     # web-siden: http://<nas-ip>:8085
      - "6881:6881/tcp"                 # torrent-trafik
      - "6881:6881/udp"
    volumes:
      - /share/Container/seedmo/config:/config
      - /share/Download/seedmo:/downloads
